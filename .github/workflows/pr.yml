name: PR checks

# Runs on every pull request. Everything here is deterministic: no Gemini key,
# no Vercel account, no microphone, no access to anyone's local machine.
# The checks that need a real key or a human (dev/live-check.mjs and the
# in-browser spoken walkthrough) are deliberately not run here -- see
# scripts/ci-checks.mjs and the README.

on:
  pull_request:
  workflow_dispatch:

# Read-only: this workflow never needs to write to the repo.
permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Deterministic checks
        run: npm run test:ci

      - name: Production build
        run: npm run build
