<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241F1E"/>
      <stop offset="100%" stop-color="#1C1817"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FBF6EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FBF6EC" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#5A4432" flood-opacity="0.13"/>
    </filter>
    <filter id="tile" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#5A4432" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="860" fill="#FBF6EC"/>

  <!-- wordmark -->
  <circle cx="54" cy="52" r="12" fill="#9B3B50"/>
  <circle cx="54" cy="52" r="5" fill="#FBF6EC"/>
  <text x="78" y="58" font-size="19" font-weight="700" fill="#3A302C">Interview<tspan fill="#9B3B50">lenz</tspan></text>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="48" y="150" width="202" height="34" rx="17" fill="#F3E8D6"/>
  <circle cx="70" cy="167" r="4" fill="#9B3B50"/>
  <text x="84" y="172" font-size="11.5" font-weight="700" fill="#9B3B50" letter-spacing="0.8">LIVE VOICE INTERVIEW</text>

  <text x="48" y="256" font-size="47" font-weight="700" fill="#3A302C">It asks you</text>
  <text x="48" y="310" font-size="47" font-weight="700" fill="#3A302C">the <tspan fill="#9B3B50">follow-up</tspan></text>
  <text x="48" y="364" font-size="47" font-weight="700" fill="#3A302C">question.</text>
  <rect x="106" y="322" width="214" height="9" rx="4.5" fill="#C77D8C" opacity="0.38"/>

  <text x="48" y="412" font-size="16.5" fill="#75665C">Not a grader. An interviewer that hears your</text>
  <text x="48" y="438" font-size="16.5" fill="#75665C">reasoning, reads the code you just ran, and</text>
  <text x="48" y="464" font-size="16.5" fill="#75665C">pushes back when the two disagree.</text>

  <rect x="48" y="504" width="204" height="56" rx="18" fill="#9B3B50" filter="url(#tile)"/>
  <text x="150" y="539" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start practice</text>
  <rect x="268" y="504" width="196" height="56" rx="18" fill="#F3E8D6"/>
  <text x="366" y="539" font-size="15.5" font-weight="600" fill="#8C2F43" text-anchor="middle">Behavioral round →</text>

  <g>
    <rect x="48" y="590" width="150" height="38" rx="19" fill="#F6EEE0"/>
    <text x="123" y="614" font-size="12.5" fill="#75665C" text-anchor="middle">No sign-up</text>
    <rect x="208" y="590" width="196" height="38" rx="19" fill="#F6EEE0"/>
    <text x="306" y="614" font-size="12.5" fill="#75665C" text-anchor="middle">Python in your browser</text>
    <rect x="414" y="590" width="98" height="38" rx="19" fill="#F6EEE0"/>
    <text x="463" y="614" font-size="12.5" fill="#75665C" text-anchor="middle">Free</text>
  </g>

  <!-- ============ RIGHT: inset rounded dark demo panel ============ -->
  <rect x="588" y="40" width="648" height="588" rx="34" fill="url(#panel)" filter="url(#soft)"/>

  <!-- editor card -->
  <rect x="620" y="76" width="584" height="268" rx="22" fill="#141211"/>
  <rect x="620" y="76" width="584" height="46" rx="22" fill="#2A2422"/>
  <rect x="620" y="104" width="584" height="18" fill="#2A2422"/>
  <text x="648" y="106" font-size="12" fill="#9A8C84" font-family="SFMono-Regular, Menlo, monospace">solution.py · v4</text>
  <rect x="1108" y="86" width="78" height="26" rx="13" fill="#9B3B50"/>
  <text x="1147" y="103" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">▶ Run</text>

  <g font-family="SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="648" y="152" fill="#5E534E">1</text><text x="674" y="152" fill="#7FB2E5">def <tspan fill="#E8D08A">contains_duplicate</tspan><tspan fill="#D9D2CE">(nums):</tspan></text>
    <text x="648" y="176" fill="#5E534E">2</text><text x="698" y="176" fill="#D9D2CE">seen = <tspan fill="#7FD3C4">set</tspan>()</text>
    <text x="648" y="200" fill="#5E534E">3</text><text x="698" y="200" fill="#D79BD0">for <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> nums:</tspan></text>
    <text x="648" y="224" fill="#5E534E">4</text><text x="722" y="224" fill="#D79BD0">if <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> seen:</tspan></text>
    <text x="648" y="248" fill="#5E534E">5</text><text x="746" y="248" fill="#D79BD0">return <tspan fill="#7FB2E5">True</tspan></text>
    <text x="648" y="272" fill="#5E534E">6</text><text x="722" y="272" fill="#D9D2CE">seen.add(n)</text>
    <text x="648" y="296" fill="#5E534E">7</text><text x="698" y="296" fill="#D79BD0">return <tspan fill="#7FB2E5">False</tspan></text>
  </g>
  <rect x="1040" y="300" width="146" height="28" rx="14" fill="#1B3A28"/>
  <text x="1113" y="319" font-size="12" font-weight="700" fill="#6EE7A0" text-anchor="middle">v4 — 4 / 4 passed</text>

  <!-- transcript -->
  <text x="620" y="382" font-size="11" font-weight="700" fill="#8A7C74" letter-spacing="1.6">TRANSCRIPT</text>
  <circle cx="1186" cy="378" r="5" fill="#6EE7A0"/>
  <text x="1174" y="382" font-size="11" fill="#8A7C74" text-anchor="end">listening</text>

  <rect x="620" y="398" width="430" height="80" rx="22" fill="#9B3B50"/>
  <text x="644" y="426" font-size="10.5" font-weight="700" fill="#F2C9D2" letter-spacing="0.8">INTERVIEWER</text>
  <text x="644" y="448" font-size="13.5" fill="#FFF4F6">You called this linear. How many comparisons</text>
  <text x="644" y="467" font-size="13.5" fill="#FFF4F6">happen if every number is unique?</text>

  <rect x="774" y="492" width="430" height="58" rx="22" fill="#332C29"/>
  <text x="798" y="516" font-size="10.5" font-weight="700" fill="#9A8C84" letter-spacing="0.8">YOU</text>
  <text x="798" y="536" font-size="13.5" fill="#DED7D3">Oh — that's n squared. The set makes it O(n).</text>

  <rect x="620" y="564" width="392" height="58" rx="22" fill="#9B3B50"/>
  <text x="644" y="588" font-size="10.5" font-weight="700" fill="#F2C9D2" letter-spacing="0.8">INTERVIEWER</text>
  <text x="644" y="608" font-size="13.5" fill="#FFF4F6">Right. What about the space cost?</text>

  <!-- ============ SCROLLABLE COMPANY RAIL ============ -->
  <text x="48" y="692" font-size="20" font-weight="700" fill="#3A302C">Practice in the style of</text>
  <text x="1232" y="692" font-size="13" font-weight="600" fill="#8C2F43" text-anchor="end">Browse all 40 →</text>

  <g filter="url(#tile)">
    <!-- Google -->
    <rect x="48" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <text x="112" y="770" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC04">o</tspan><tspan fill="#34A853">g</tspan></text>
    <text x="112" y="798" font-size="12" fill="#75665C" text-anchor="middle">Google</text>
    <!-- Nvidia -->
    <rect x="188" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <rect x="236" y="744" width="32" height="26" rx="6" fill="#76B900"/>
    <text x="252" y="798" font-size="12" fill="#75665C" text-anchor="middle">NVIDIA</text>
    <!-- Meta -->
    <rect x="328" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <text x="392" y="772" font-size="34" font-weight="700" fill="#0866FF" text-anchor="middle">∞</text>
    <text x="392" y="798" font-size="12" fill="#75665C" text-anchor="middle">Meta</text>
    <!-- Amazon -->
    <rect x="468" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <text x="532" y="768" font-size="26" font-weight="700" fill="#232F3E" text-anchor="middle">a</text>
    <path d="M 512 774 Q 532 786 552 774" stroke="#FF9900" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="532" y="798" font-size="12" fill="#75665C" text-anchor="middle">Amazon</text>
    <!-- Microsoft -->
    <rect x="608" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <rect x="658" y="742" width="13" height="13" fill="#F25022"/><rect x="673" y="742" width="13" height="13" fill="#7FBA00"/>
    <rect x="658" y="757" width="13" height="13" fill="#00A4EF"/><rect x="673" y="757" width="13" height="13" fill="#FFB900"/>
    <text x="672" y="798" font-size="12" fill="#75665C" text-anchor="middle">Microsoft</text>
    <!-- Stripe -->
    <rect x="748" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <text x="812" y="772" font-size="30" font-weight="700" fill="#635BFF" text-anchor="middle">S</text>
    <text x="812" y="798" font-size="12" fill="#75665C" text-anchor="middle">Stripe</text>
    <!-- Figma -->
    <rect x="888" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <circle cx="944" cy="748" r="9" fill="#F24E1E"/><circle cx="960" cy="748" r="9" fill="#FF7262"/>
    <circle cx="944" cy="766" r="9" fill="#A259FF"/><circle cx="960" cy="766" r="9" fill="#1ABCFE"/>
    <text x="952" y="798" font-size="12" fill="#75665C" text-anchor="middle">Figma</text>
    <!-- Ramp (small co) -->
    <rect x="1028" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <path d="M 1076 768 L 1092 740 L 1108 768 Z" fill="#E3A008"/>
    <text x="1092" y="798" font-size="12" fill="#75665C" text-anchor="middle">Ramp</text>
    <!-- next, partially cut to show scroll -->
    <rect x="1168" y="716" width="128" height="104" rx="26" fill="#FFFFFF"/>
    <text x="1216" y="772" font-size="30" font-weight="700" fill="#0A0A0A" text-anchor="middle">▲</text>
  </g>

  <!-- edge fades signalling horizontal scroll -->
  <rect x="0" y="700" width="48" height="136" fill="url(#fadeL)"/>
  <rect x="1196" y="700" width="84" height="136" fill="url(#fadeR)"/>

  <!-- scroll track -->
  <rect x="48" y="836" width="1184" height="5" rx="2.5" fill="#EFE4D2"/>
  <rect x="48" y="836" width="396" height="5" rx="2.5" fill="#C9A9A4"/>
</svg>
