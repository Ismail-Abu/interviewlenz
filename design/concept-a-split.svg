<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="1"/><stop offset="100%" stop-color="#FBF6EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="0"/><stop offset="100%" stop-color="#FBF6EC" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#5A4432" flood-opacity="0.13"/>
    </filter>
    <filter id="tile" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#5A4432" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="920" fill="#FBF6EC"/>

  <!-- ============ NAV (pill) ============ -->
  <rect x="40" y="24" width="1200" height="68" rx="34" fill="#F6EEE0" filter="url(#tile)"/>
  <circle cx="82" cy="58" r="12" fill="#9B3B50"/>
  <circle cx="82" cy="58" r="5" fill="#F6EEE0"/>
  <text x="106" y="64" font-size="19" font-weight="700" fill="#3A302C">Interview<tspan fill="#9B3B50">lenz</tspan></text>

  <rect x="432" y="42" width="96" height="32" rx="16" fill="#F3E8D6"/>
  <text x="480" y="63" font-size="14" fill="#8C2F43" font-weight="600" text-anchor="middle">Practice</text>
  <text x="572" y="63" font-size="14" fill="#75665C">Companies</text>
  <text x="684" y="63" font-size="14" fill="#75665C">How it works</text>

  <text x="1004" y="63" font-size="14" fill="#75665C">Sign in</text>
  <rect x="1064" y="38" width="152" height="40" rx="20" fill="#9B3B50"/>
  <text x="1140" y="63" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start practice</text>

  <!-- ============ HERO LEFT ============ -->
  <rect x="48" y="146" width="208" height="34" rx="17" fill="#F3E8D6"/>
  <circle cx="70" cy="163" r="4" fill="#9B3B50"/>
  <text x="84" y="168" font-size="11.5" font-weight="700" fill="#9B3B50" letter-spacing="0.8">MOCK INTERVIEWS FOR CS</text>

  <text x="48" y="242" font-size="48" font-weight="700" fill="#3A302C">A coding interview</text>
  <text x="48" y="298" font-size="48" font-weight="700" fill="#3A302C">that <tspan fill="#9B3B50">listens</tspan> to how</text>
  <text x="48" y="354" font-size="48" font-weight="700" fill="#3A302C">you explain it</text>
  <rect x="138" y="310" width="132" height="9" rx="4.5" fill="#C77D8C" opacity="0.38"/>

  <text x="48" y="400" font-size="16.5" fill="#75665C">Most tools grade code after you submit. Interviewlenz asks</text>
  <text x="48" y="426" font-size="16.5" fill="#75665C">follow-up questions while you think out loud — grounded in</text>
  <text x="48" y="452" font-size="16.5" fill="#75665C">what you actually wrote and how your tests did.</text>

  <rect x="48" y="492" width="200" height="56" rx="18" fill="#9B3B50" filter="url(#tile)"/>
  <text x="148" y="527" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start practice</text>
  <rect x="264" y="492" width="188" height="56" rx="18" fill="#F3E8D6"/>
  <text x="358" y="527" font-size="15.5" font-weight="600" fill="#8C2F43" text-anchor="middle">Skip to coding</text>

  <text x="48" y="580" font-size="13" fill="#75665C">No sign-up · Python runs in your browser · Free</text>

  <!-- ============ HERO RIGHT: editor card ============ -->
  <rect x="652" y="146" width="580" height="404" rx="30" fill="#1C1817" filter="url(#soft)"/>
  <rect x="652" y="146" width="580" height="48" rx="30" fill="#2A2422"/>
  <rect x="652" y="176" width="580" height="18" fill="#2A2422"/>
  <circle cx="682" cy="170" r="5.5" fill="#FF6F61"/>
  <circle cx="702" cy="170" r="5.5" fill="#F7C948"/>
  <circle cx="722" cy="170" r="5.5" fill="#5BD48A"/>
  <text x="750" y="175" font-size="12" fill="#9A8C84" font-family="SFMono-Regular, Menlo, monospace">solution.py · v4</text>
  <rect x="1130" y="158" width="78" height="26" rx="13" fill="#9B3B50"/>
  <text x="1169" y="175" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">▶ Run</text>

  <g font-family="SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="682" y="228" fill="#5E534E">1</text><text x="708" y="228" fill="#7FB2E5">def <tspan fill="#E8D08A">contains_duplicate</tspan><tspan fill="#D9D2CE">(nums):</tspan></text>
    <text x="682" y="254" fill="#5E534E">2</text><text x="732" y="254" fill="#D9D2CE">seen = <tspan fill="#7FD3C4">set</tspan>()</text>
    <text x="682" y="280" fill="#5E534E">3</text><text x="732" y="280" fill="#D79BD0">for <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> nums:</tspan></text>
    <text x="682" y="306" fill="#5E534E">4</text><text x="756" y="306" fill="#D79BD0">if <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> seen:</tspan></text>
    <text x="682" y="332" fill="#5E534E">5</text><text x="780" y="332" fill="#D79BD0">return <tspan fill="#7FB2E5">True</tspan></text>
    <text x="682" y="358" fill="#5E534E">6</text><text x="756" y="358" fill="#D9D2CE">seen.add(n)</text>
    <text x="682" y="384" fill="#5E534E">7</text><text x="732" y="384" fill="#D79BD0">return <tspan fill="#7FB2E5">False</tspan></text>
  </g>

  <rect x="1062" y="400" width="146" height="28" rx="14" fill="#1B3A28"/>
  <text x="1135" y="419" font-size="12" font-weight="700" fill="#6EE7A0" text-anchor="middle">v4 — 4 / 4 passed</text>

  <!-- interviewer bubble -->
  <rect x="596" y="452" width="406" height="80" rx="24" fill="#9B3B50" filter="url(#tile)"/>
  <text x="620" y="480" font-size="10.5" font-weight="700" fill="#F2C9D2" letter-spacing="0.8">INTERVIEWER</text>
  <text x="620" y="502" font-size="13.5" fill="#FFF4F6">You said this was linear — how many</text>
  <text x="620" y="521" font-size="13.5" fill="#FFF4F6">comparisons if every number is unique?</text>

  <!-- ============ FEATURES ============ -->
  <g>
    <rect x="48" y="618" width="378" height="130" rx="26" fill="#F6EEE0"/>
    <circle cx="84" cy="658" r="17" fill="#9B3B50" opacity="0.13"/>
    <text x="84" y="664" font-size="15" text-anchor="middle" fill="#9B3B50">🎙</text>
    <text x="114" y="664" font-size="16" font-weight="700" fill="#3A302C">It listens while you code</text>
    <text x="76" y="694" font-size="13.5" fill="#75665C">Explain your approach out loud. It asks one</text>
    <text x="76" y="716" font-size="13.5" fill="#75665C">focused follow-up and waits for your answer.</text>
  </g>
  <g>
    <rect x="450" y="618" width="378" height="130" rx="26" fill="#F6EEE0"/>
    <circle cx="486" cy="658" r="17" fill="#9B3B50" opacity="0.13"/>
    <text x="486" y="664" font-size="15" text-anchor="middle" fill="#9B3B50">⚙</text>
    <text x="516" y="664" font-size="16" font-weight="700" fill="#3A302C">Grounded in your runs</text>
    <text x="478" y="694" font-size="13.5" fill="#75665C">It knows which version you ran and how many</text>
    <text x="478" y="716" font-size="13.5" fill="#75665C">cases passed — not just your final code.</text>
  </g>
  <g>
    <rect x="852" y="618" width="378" height="130" rx="26" fill="#F6EEE0"/>
    <circle cx="888" cy="658" r="17" fill="#9B3B50" opacity="0.13"/>
    <text x="888" y="664" font-size="15" text-anchor="middle" fill="#9B3B50">★</text>
    <text x="918" y="664" font-size="16" font-weight="700" fill="#3A302C">A report with receipts</text>
    <text x="880" y="694" font-size="13.5" fill="#75665C">Every point cites the line you wrote or the</text>
    <text x="880" y="716" font-size="13.5" fill="#75665C">sentence you said. Plus a score and next steps.</text>
  </g>

  <!-- ============ SCROLLABLE COMPANY RAIL ============ -->
  <text x="48" y="800" font-size="20" font-weight="700" fill="#3A302C">Practice in the style of</text>
  <text x="1232" y="800" font-size="13" font-weight="600" fill="#8C2F43" text-anchor="end">Browse all 40 →</text>

  <g filter="url(#tile)">
    <rect x="48" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <text x="112" y="858" font-size="24" font-weight="700" text-anchor="middle"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC04">o</tspan><tspan fill="#34A853">g</tspan></text>
    <text x="112" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Google</text>

    <rect x="188" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <rect x="236" y="838" width="32" height="24" rx="6" fill="#76B900"/>
    <text x="252" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">NVIDIA</text>

    <rect x="328" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <text x="392" y="862" font-size="28" font-weight="700" fill="#0866FF" text-anchor="middle">∞</text>
    <text x="392" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Meta</text>

    <rect x="468" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <text x="532" y="858" font-size="22" font-weight="700" fill="#232F3E" text-anchor="middle">a</text>
    <path d="M 514 864 Q 532 874 550 864" stroke="#FF9900" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="532" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Amazon</text>

    <rect x="608" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <rect x="659" y="836" width="12" height="12" fill="#F25022"/><rect x="673" y="836" width="12" height="12" fill="#7FBA00"/>
    <rect x="659" y="850" width="12" height="12" fill="#00A4EF"/><rect x="673" y="850" width="12" height="12" fill="#FFB900"/>
    <text x="672" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Microsoft</text>

    <rect x="748" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <text x="812" y="860" font-size="26" font-weight="700" fill="#635BFF" text-anchor="middle">S</text>
    <text x="812" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Stripe</text>

    <rect x="888" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <circle cx="944" cy="842" r="8" fill="#F24E1E"/><circle cx="960" cy="842" r="8" fill="#FF7262"/>
    <circle cx="944" cy="858" r="8" fill="#A259FF"/><circle cx="960" cy="858" r="8" fill="#1ABCFE"/>
    <text x="952" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Figma</text>

    <rect x="1028" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <path d="M 1078 860 L 1092 836 L 1106 860 Z" fill="#E3A008"/>
    <text x="1092" y="882" font-size="11.5" fill="#75665C" text-anchor="middle">Ramp</text>

    <rect x="1168" y="820" width="128" height="80" rx="24" fill="#FFFFFF"/>
    <text x="1216" y="862" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">▲</text>
  </g>

  <rect x="0" y="806" width="48" height="112" fill="url(#fadeL)"/>
  <rect x="1196" y="806" width="84" height="112" fill="url(#fadeR)"/>
</svg>
