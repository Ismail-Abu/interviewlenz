<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="1"/><stop offset="100%" stop-color="#FBF6EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="0"/><stop offset="100%" stop-color="#FBF6EC" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#5A4432" flood-opacity="0.14"/>
    </filter>
    <filter id="tile" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#5A4432" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="#FBF6EC"/>

  <!-- minimal top bar -->
  <circle cx="54" cy="52" r="12" fill="#9B3B50"/>
  <circle cx="54" cy="52" r="5" fill="#FBF6EC"/>
  <text x="78" y="58" font-size="19" font-weight="700" fill="#3A302C">Interview<tspan fill="#9B3B50">lenz</tspan></text>
  <text x="1058" y="58" font-size="14" fill="#75665C">How it works</text>
  <rect x="1162" y="34" width="78" height="36" rx="18" fill="#F3E8D6"/>
  <text x="1201" y="58" font-size="14" fill="#8C2F43" font-weight="600" text-anchor="middle">Sign in</text>

  <!-- ============ CENTRED EDITORIAL HERO ============ -->
  <rect x="512" y="126" width="256" height="34" rx="17" fill="#F3E8D6"/>
  <circle cx="534" cy="143" r="4" fill="#9B3B50"/>
  <text x="548" y="148" font-size="11.5" font-weight="700" fill="#9B3B50" letter-spacing="0.8">MOCK INTERVIEWS FOR CS STUDENTS</text>

  <text x="640" y="248" font-size="60" font-weight="700" fill="#3A302C" text-anchor="middle">A coding interview that</text>
  <text x="640" y="320" font-size="60" font-weight="700" fill="#3A302C" text-anchor="middle"><tspan fill="#9B3B50">listens</tspan> to how you explain</text>
  <path d="M 342 334 Q 424 323 510 333 Q 424 343 342 334 Z" fill="#C77D8C" opacity="0.42"/>

  <text x="640" y="378" font-size="17.5" fill="#75665C" text-anchor="middle">Most tools grade your code after you submit it. This one asks follow-up</text>
  <text x="640" y="406" font-size="17.5" fill="#75665C" text-anchor="middle">questions while you think out loud, grounded in what you actually wrote.</text>

  <rect x="494" y="446" width="200" height="58" rx="19" fill="#9B3B50" filter="url(#tile)"/>
  <text x="594" y="482" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start practice</text>
  <rect x="710" y="446" width="226" height="58" rx="19" fill="#F3E8D6"/>
  <text x="823" y="482" font-size="15.5" font-weight="600" fill="#8C2F43" text-anchor="middle">Skip to a coding round →</text>

  <text x="640" y="536" font-size="13" fill="#75665C" text-anchor="middle">No sign-up required · Python runs in your browser · Free for students</text>

  <!-- ============ ONE WIDE SCREENSHOT ============ -->
  <rect x="200" y="572" width="880" height="214" rx="30" fill="#1C1817" filter="url(#soft)"/>
  <rect x="200" y="572" width="880" height="42" rx="30" fill="#2A2422"/>
  <rect x="200" y="596" width="880" height="18" fill="#2A2422"/>
  <circle cx="228" cy="593" r="5" fill="#FF6F61"/>
  <circle cx="246" cy="593" r="5" fill="#F7C948"/>
  <circle cx="264" cy="593" r="5" fill="#5BD48A"/>
  <text x="640" y="598" font-size="11.5" fill="#9A8C84" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">Interviewlenz — Contains Duplicate</text>

  <line x1="492" y1="614" x2="492" y2="786" stroke="#332C29"/>
  <text x="232" y="648" font-size="15" font-weight="700" fill="#E8E2DE">Contains Duplicate</text>
  <text x="232" y="672" font-size="12" fill="#9A8C84">Return True if any integer occurs</text>
  <text x="232" y="690" font-size="12" fill="#9A8C84">more than once.</text>
  <rect x="232" y="706" width="228" height="54" rx="14" fill="#2A2422"/>
  <text x="248" y="728" font-size="11.5" fill="#D9D2CE" font-family="SFMono-Regular, Menlo, monospace">Input: nums = [1, 2, 3, 1]</text>
  <text x="248" y="748" font-size="11.5" fill="#D9D2CE" font-family="SFMono-Regular, Menlo, monospace">Output: True</text>

  <g font-family="SFMono-Regular, Menlo, monospace" font-size="12.5">
    <text x="518" y="648" fill="#7FB2E5">def <tspan fill="#E8D08A">contains_duplicate</tspan><tspan fill="#D9D2CE">(nums):</tspan></text>
    <text x="538" y="670" fill="#D9D2CE">seen = <tspan fill="#7FD3C4">set</tspan>()</text>
    <text x="538" y="692" fill="#D79BD0">for <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> nums:</tspan></text>
    <text x="558" y="714" fill="#D79BD0">if <tspan fill="#D9D2CE">n </tspan><tspan fill="#D79BD0">in</tspan><tspan fill="#D9D2CE"> seen: </tspan><tspan fill="#D79BD0">return</tspan><tspan fill="#7FB2E5"> True</tspan></text>
  </g>
  <rect x="912" y="634" width="130" height="26" rx="13" fill="#1B3A28"/>
  <text x="977" y="652" font-size="11.5" font-weight="700" fill="#6EE7A0" text-anchor="middle">v4 — 4 / 4 passed</text>

  <rect x="518" y="726" width="438" height="48" rx="20" fill="#9B3B50"/>
  <text x="538" y="746" font-size="10.5" font-weight="700" fill="#F2C9D2" letter-spacing="0.8">INTERVIEWER</text>
  <text x="538" y="764" font-size="12.5" fill="#FFF4F6">How many comparisons if every number is unique?</text>

  <!-- ============ SCROLLABLE COMPANY RAIL ============ -->
  <text x="640" y="826" font-size="14" fill="#75665C" text-anchor="middle" letter-spacing="0.4">Practice in the style of</text>

  <g filter="url(#tile)">
    <rect x="96" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <text x="154" y="876" font-size="21" font-weight="700" text-anchor="middle"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC04">o</tspan><tspan fill="#34A853">g</tspan></text>

    <rect x="226" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <rect x="268" y="856" width="32" height="24" rx="6" fill="#76B900"/>

    <rect x="356" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <text x="414" y="880" font-size="26" font-weight="700" fill="#0866FF" text-anchor="middle">∞</text>

    <rect x="486" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <text x="544" y="874" font-size="21" font-weight="700" fill="#232F3E" text-anchor="middle">a</text>
    <path d="M 528 880 Q 544 888 560 880" stroke="#FF9900" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <rect x="616" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <rect x="661" y="856" width="12" height="12" fill="#F25022"/><rect x="675" y="856" width="12" height="12" fill="#7FBA00"/>
    <rect x="661" y="870" width="12" height="12" fill="#00A4EF"/><rect x="675" y="870" width="12" height="12" fill="#FFB900"/>

    <rect x="746" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <text x="804" y="878" font-size="24" font-weight="700" fill="#635BFF" text-anchor="middle">S</text>

    <rect x="876" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <circle cx="926" cy="860" r="8" fill="#F24E1E"/><circle cx="942" cy="860" r="8" fill="#FF7262"/>
    <circle cx="926" cy="876" r="8" fill="#A259FF"/><circle cx="942" cy="876" r="8" fill="#1ABCFE"/>

    <rect x="1006" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <path d="M 1050 878 L 1064 854 L 1078 878 Z" fill="#E3A008"/>

    <rect x="1136" y="840" width="116" height="56" rx="20" fill="#FFFFFF"/>
    <text x="1180" y="878" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">▲</text>
  </g>

  <rect x="0" y="830" width="96" height="70" fill="url(#fadeL)"/>
  <rect x="1176" y="830" width="104" height="70" fill="url(#fadeR)"/>
</svg>
